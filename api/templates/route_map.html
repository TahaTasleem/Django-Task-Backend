<!DOCTYPE html>
<html>
<head>
    <title>Route Map</title>
    <style>
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .map-container {
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 4px;
        }
        .error {
            color: red;
            padding: 10px;
            background-color: #ffe6e6;
            border-radius: 4px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="map-container">
            {{ map|safe }}
            <div class="stats">
                <div>Total Distance: {{ total_distance }} miles</div>
                <div>Total Fuel Cost: ${{ total_fuel_cost }}</div>
            </div>
        </div>
        {% endif %}
    </div>
</body>
</html>
